name: Build iOS

on:
  push:
    branches: [desarrollo]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/lista_tareas

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/lista_tareas/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app Angular/Ionic
        run: npm run build

      - name: Sincronizar Capacitor con iOS (copia assets + pod install)
        run: npx cap sync ios

      - name: Compilar el proyecto iOS (sin firmar, para simulador)
        working-directory: app/lista_tareas/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
